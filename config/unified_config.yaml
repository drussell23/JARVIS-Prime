# =============================================================================
# UNIFIED TRINITY CONFIGURATION v1.0
# =============================================================================
# Single Source of Truth for JARVIS, JARVIS-Prime, and Reactor-Core
#
# This configuration is dynamically loaded and supports hot-reload.
# All values can be overridden via environment variables using the pattern:
#   TRINITY_<SECTION>_<KEY> (e.g., TRINITY_JARVIS_PRIME_PORT=8001)
#
# The system reads configuration in this priority order:
#   1. Environment variables (highest priority)
#   2. This YAML file
#   3. Hardcoded defaults (lowest priority)
# =============================================================================

version: "1.0"
last_updated: "2026-01-11"

# =============================================================================
# TRINITY ECOSYSTEM COMPONENTS
# =============================================================================

components:
  jarvis:
    name: "JARVIS-AI-Agent"
    type: "body"
    description: "Main orchestrator - Computer use, action execution, window management"
    enabled: true
    port: 8080
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    startup_timeout_seconds: 60
    shutdown_timeout_seconds: 30
    auto_restart: true
    max_restarts: 5
    restart_delay_seconds: 5.0
    entry_point: "run_jarvis.py"
    # Path resolution (tried in order)
    path_candidates:
      - "${JARVIS_AI_AGENT_PATH}"
      - "${JARVIS_BASE_DIR}/JARVIS-AI-Agent"
      - "${JARVIS_BASE_DIR}/jarvis-ai-agent"
      - "../JARVIS-AI-Agent"
      - "../JARVIS"
    dependencies: []

  jarvis_prime:
    name: "JARVIS-Prime"
    type: "mind"
    description: "Cognitive engine - LLM inference, reasoning, AGI models"
    enabled: true
    port: 8000
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    startup_timeout_seconds: 120  # Model loading takes time
    shutdown_timeout_seconds: 30
    auto_restart: true
    max_restarts: 3
    restart_delay_seconds: 10.0
    entry_point: "run_server.py"
    path_candidates:
      - "${JARVIS_PRIME_PATH}"
      - "."  # Current directory
    dependencies: []

  reactor_core:
    name: "Reactor-Core"
    type: "soul"
    description: "Training pipeline - Model training, fine-tuning, deployment"
    enabled: false  # Disabled by default - training on demand
    port: 8090
    health_endpoint: "/health"
    metrics_endpoint: "/metrics"
    startup_timeout_seconds: 60
    shutdown_timeout_seconds: 60  # Training cleanup takes time
    auto_restart: false  # Don't auto-restart training
    max_restarts: 1
    restart_delay_seconds: 30.0
    entry_point: "run_reactor.py"
    path_candidates:
      - "${REACTOR_CORE_PATH}"
      - "${JARVIS_BASE_DIR}/Reactor-Core"
      - "${JARVIS_BASE_DIR}/reactor-core"
      - "../Reactor-Core"
    dependencies:
      - "jarvis_prime"

# =============================================================================
# MODEL ROUTING CONFIGURATION (v94.0 Hybrid Tiered Architecture)
# =============================================================================
#
# ARCHITECTURE:
#   ┌─────────────────────────────────────────────────────────────────────────┐
#   │                    JARVIS-Prime Hybrid Model Tiers                       │
#   │                                                                          │
#   │  ┌──────────────────┐  ┌──────────────────┐  ┌──────────────────┐       │
#   │  │  TIER 0: LOCAL   │  │  TIER 1: CLOUD   │  │  TIER 2: DEEP    │       │
#   │  │  (M1 Mac Fast)   │  │  (GCP A100)      │  │  (Opus-Level)    │       │
#   │  │                  │  │                  │  │                  │       │
#   │  │  • Llama 3 8B    │  │  • Llama 3.3 70B │  │  • DeepSeek V3   │       │
#   │  │  • Qwen 2.5 7B   │  │  • Qwen 2.5 72B  │  │  • Claude Opus   │       │
#   │  │  • Mistral 7B    │  │  • Mixtral 8x22B │  │  • GPT-4 Turbo   │       │
#   │  │                  │  │                  │  │                  │       │
#   │  │  Speed: ~20t/s   │  │  Speed: ~40t/s   │  │  Speed: ~50t/s   │       │
#   │  │  Cost: FREE      │  │  Cost: ~$0.50/hr │  │  Cost: ~$0.01/1k │       │
#   │  │  Complexity: <0.4│  │  Complexity: 0.4-│  │  Complexity: >0.8│       │
#   │  └──────────────────┘  │             0.8  │  └──────────────────┘       │
#   │                        └──────────────────┘                             │
#   └─────────────────────────────────────────────────────────────────────────┘
#
# ROUTING LOGIC:
#   1. Analyze query complexity (lexical, pattern, semantic)
#   2. Check resource availability (RAM, GPU, network)
#   3. Route to optimal tier based on complexity + resources
#   4. Fallback to next tier if primary unavailable
#   5. Log experience for adaptive learning
#

model_routing:
  version: "94.0"

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER DEFINITIONS
  # ═══════════════════════════════════════════════════════════════════════════

  tiers:
    # ─────────────────────────────────────────────────────────────────────────
    # TIER 0: LOCAL (M1/M2/M3 Mac - Always Available, Free)
    # ─────────────────────────────────────────────────────────────────────────
    tier_0_local_fast:
      name: "Local 8B Fast"
      description: "Lightning-fast local inference for simple tasks"
      tier_level: 0
      priority: 1
      enabled: true

      # Endpoint
      endpoint: "http://localhost:8000"
      model_type: "llama_cpp"

      # Model variants (tried in order)
      models:
        primary:
          name: "Llama-3-8B-Instruct"
          path: "${HOME}/.jarvis/prime/models/Meta-Llama-3-8B-Instruct.Q4_K_M.gguf"
          quantization: "Q4_K_M"
        fallbacks:
          - name: "Qwen-2.5-7B-Instruct"
            path: "${HOME}/Documents/ai-models/qwen2.5-7b-instruct-q4_k_m.gguf"
            quantization: "Q4_K_M"
          - name: "Mistral-7B-Instruct"
            path: "${HOME}/Documents/ai-models/mistral-7b-instruct-v0.1.Q4_K_M.gguf"
            quantization: "Q4_K_M"

      # Capabilities this tier handles well
      capabilities:
        - chat                # "What time is it?"
        - greeting            # "Hello JARVIS"
        - simple_qa           # "What's 2+2?"
        - summarize_short     # Summarize < 1000 words
        - format              # JSON/markdown formatting
        - code_simple         # Simple code snippets
        - translate_short     # Short translations

      # Performance characteristics
      performance:
        tokens_per_second: 20           # Apple Silicon Metal
        max_context_tokens: 8192
        max_output_tokens: 2048
        average_latency_ms: 500
        warm_start_latency_ms: 100
        cold_start_latency_ms: 10000    # Model loading

      # Resource requirements
      resources:
        memory_required_mb: 5120        # ~5GB for 8B Q4
        gpu_layers: -1                  # All on Metal GPU
        cpu_threads: 4
        requires_gpu: false             # Can run CPU-only

      # Cost
      cost:
        per_1k_input_tokens: 0.0        # Free
        per_1k_output_tokens: 0.0
        per_hour: 0.0

      # Routing hints
      routing:
        max_complexity: 0.45            # Only simple tasks
        max_input_tokens: 2000          # Short prompts only
        prefer_for_latency_ms: 2000     # Use if need < 2s response

    # ─────────────────────────────────────────────────────────────────────────
    # TIER 0.5: LOCAL CAPABLE (For medium complexity on M1)
    # ─────────────────────────────────────────────────────────────────────────
    tier_05_local_capable:
      name: "Local 14B Capable"
      description: "More capable local model for moderate tasks"
      tier_level: 0
      priority: 2
      enabled: true

      endpoint: "http://localhost:8000"
      model_type: "llama_cpp"

      models:
        primary:
          name: "Qwen-2.5-14B-Instruct"
          path: "${HOME}/.jarvis/prime/models/qwen2.5-14b-instruct-q4_k_m.gguf"
          quantization: "Q4_K_M"
        fallbacks:
          - name: "Phi-3-Medium-14B"
            path: "${HOME}/.jarvis/prime/models/phi-3-medium-14b-q4_k_m.gguf"
            quantization: "Q4_K_M"

      capabilities:
        - chat
        - greeting
        - simple_qa
        - summarize_short
        - summarize_medium
        - format
        - code_simple
        - code_medium
        - translate
        - analyze_simple
        - creative_short

      performance:
        tokens_per_second: 12
        max_context_tokens: 8192
        max_output_tokens: 4096
        average_latency_ms: 1500
        warm_start_latency_ms: 300
        cold_start_latency_ms: 20000

      resources:
        memory_required_mb: 8192        # ~8GB for 14B Q4
        gpu_layers: -1
        cpu_threads: 6
        requires_gpu: false

      cost:
        per_1k_input_tokens: 0.0
        per_1k_output_tokens: 0.0
        per_hour: 0.0

      routing:
        max_complexity: 0.65
        max_input_tokens: 4000
        prefer_for_latency_ms: 5000

    # ─────────────────────────────────────────────────────────────────────────
    # TIER 1: CLOUD INTELLIGENT (GCP A100 - Complex Reasoning)
    # ─────────────────────────────────────────────────────────────────────────
    tier_1_cloud_intelligent:
      name: "Cloud 70B Intelligent"
      description: "GCP A100 with Llama 3.3 70B for complex reasoning"
      tier_level: 1
      priority: 3
      enabled: "${GCP_ENABLED:-false}"

      endpoint: "${GCP_PRIME_URL:-https://jarvis-prime-xxxxx-uc.a.run.app}"
      model_type: "vllm"  # or llama_cpp

      models:
        primary:
          name: "Llama-3.3-70B-Instruct"
          hf_id: "meta-llama/Llama-3.3-70B-Instruct"
          quantization: "AWQ"  # 4-bit quantization for A100
        fallbacks:
          - name: "Qwen-2.5-72B-Instruct"
            hf_id: "Qwen/Qwen2.5-72B-Instruct-AWQ"
            quantization: "AWQ"
          - name: "Mixtral-8x22B-Instruct"
            hf_id: "mistralai/Mixtral-8x22B-Instruct-v0.1"
            quantization: "AWQ"

      capabilities:
        - chat
        - greeting
        - simple_qa
        - summarize_short
        - summarize_medium
        - summarize_long
        - format
        - code_simple
        - code_medium
        - code_complex        # Full codebase analysis
        - translate
        - analyze_simple
        - analyze_complex     # Deep analysis
        - reason              # Multi-step reasoning
        - creative_short
        - creative_long
        - math                # Complex math
        - science             # Scientific reasoning

      performance:
        tokens_per_second: 45           # A100 with vLLM
        max_context_tokens: 131072      # 128K context
        max_output_tokens: 16384
        average_latency_ms: 3000
        warm_start_latency_ms: 500
        cold_start_latency_ms: 180000   # VM spin-up + model load

      resources:
        memory_required_mb: 45056       # ~44GB VRAM for 70B AWQ
        gpu_type: "nvidia-a100-40gb"
        gpu_count: 1
        requires_gpu: true

      cost:
        per_1k_input_tokens: 0.0004     # vLLM is efficient
        per_1k_output_tokens: 0.0008
        per_hour: 1.20                  # A100 spot pricing

      routing:
        min_complexity: 0.40            # Medium+ complexity
        max_complexity: 0.85
        max_input_tokens: 32000
        prefer_for_latency_ms: 30000

      # GCP VM configuration
      gcp_config:
        machine_type: "a2-highgpu-1g"   # 12 vCPU, 85GB RAM, 1x A100
        accelerator_type: "nvidia-tesla-a100"
        accelerator_count: 1
        boot_disk_size_gb: 200
        boot_disk_type: "pd-ssd"
        preemptible: true               # Spot VM for cost savings
        auto_delete: true

    # ─────────────────────────────────────────────────────────────────────────
    # TIER 2: DEEP REASONING (Opus-Level Intelligence)
    # ─────────────────────────────────────────────────────────────────────────
    tier_2_deep_reasoning:
      name: "Deep Reasoning (Opus-Level)"
      description: "Maximum intelligence for hardest problems"
      tier_level: 2
      priority: 4
      enabled: true

      # Can be GCP with larger model or Claude API
      endpoint: "${DEEP_REASONING_URL:-https://api.anthropic.com/v1}"
      model_type: "anthropic"  # or vllm for DeepSeek

      models:
        primary:
          name: "Claude-Opus-4"
          provider: "anthropic"
          model_id: "claude-opus-4-20250514"
        fallbacks:
          - name: "Claude-3.5-Sonnet"
            provider: "anthropic"
            model_id: "claude-3-5-sonnet-20241022"
          - name: "DeepSeek-V3"
            provider: "deepseek"
            model_id: "deepseek-chat"
          - name: "GPT-4-Turbo"
            provider: "openai"
            model_id: "gpt-4-turbo-preview"

      capabilities:
        - all                 # Handles everything
        - multimodal          # Image understanding
        - search              # Web search integration
        - code_architect      # System design
        - paper_analysis      # Research paper understanding
        - math_advanced       # Advanced mathematics
        - legal               # Legal document analysis
        - medical             # Medical information
        - financial           # Financial analysis

      performance:
        tokens_per_second: 80
        max_context_tokens: 200000
        max_output_tokens: 32768
        average_latency_ms: 5000
        warm_start_latency_ms: 100
        cold_start_latency_ms: 500

      resources:
        memory_required_mb: 0           # API-based
        requires_gpu: false

      cost:
        per_1k_input_tokens: 0.015
        per_1k_output_tokens: 0.075
        per_hour: 0.0                   # Pay per token

      routing:
        min_complexity: 0.75            # Only hard problems
        max_input_tokens: 100000
        prefer_for_latency_ms: 60000

  # ═══════════════════════════════════════════════════════════════════════════
  # INTELLIGENT ROUTING RULES
  # ═══════════════════════════════════════════════════════════════════════════

  routing_rules:
    # Complexity thresholds
    complexity_thresholds:
      tier_0_fast_max: 0.35       # Simple → Local Fast (8B)
      tier_05_capable_max: 0.55   # Medium → Local Capable (14B)
      tier_1_cloud_max: 0.80      # Complex → Cloud (70B)
      tier_2_deep_min: 0.75       # Very Complex → Deep (Opus)

    # Task type → preferred tier
    task_type_routing:
      # Tier 0 Fast (8B)
      greeting: "tier_0_local_fast"
      chat: "tier_0_local_fast"
      simple_qa: "tier_0_local_fast"
      time_query: "tier_0_local_fast"
      format: "tier_0_local_fast"
      translate_short: "tier_0_local_fast"

      # Tier 0.5 Capable (14B)
      summarize: "tier_05_local_capable"
      code_simple: "tier_05_local_capable"
      creative_short: "tier_05_local_capable"
      analyze_simple: "tier_05_local_capable"

      # Tier 1 Cloud (70B)
      code_complex: "tier_1_cloud_intelligent"
      analyze_complex: "tier_1_cloud_intelligent"
      reason: "tier_1_cloud_intelligent"
      math: "tier_1_cloud_intelligent"
      creative_long: "tier_1_cloud_intelligent"

      # Tier 2 Deep (Opus)
      multimodal: "tier_2_deep_reasoning"
      search: "tier_2_deep_reasoning"
      code_architect: "tier_2_deep_reasoning"
      paper_analysis: "tier_2_deep_reasoning"
      legal: "tier_2_deep_reasoning"

    # Fallback chains per starting tier
    fallback_chains:
      tier_0_local_fast:
        - "tier_05_local_capable"
        - "tier_1_cloud_intelligent"
        - "tier_2_deep_reasoning"
      tier_05_local_capable:
        - "tier_0_local_fast"
        - "tier_1_cloud_intelligent"
        - "tier_2_deep_reasoning"
      tier_1_cloud_intelligent:
        - "tier_05_local_capable"
        - "tier_2_deep_reasoning"
        - "tier_0_local_fast"
      tier_2_deep_reasoning:
        - "tier_1_cloud_intelligent"
        - "tier_05_local_capable"

    # Resource-based routing
    resource_routing:
      # Local resource thresholds
      local_max_ram_percent: 85
      local_max_ram_mb: 14336
      local_min_free_ram_mb: 2048

      # Skip cloud if network is slow
      cloud_min_bandwidth_mbps: 10
      cloud_max_ping_ms: 200

      # Latency-based routing
      latency_routing:
        realtime_max_ms: 1000         # Use local only
        interactive_max_ms: 5000      # Prefer local
        batch_max_ms: 60000           # Can use cloud

    # Token-based routing
    token_routing:
      # Route based on prompt length
      local_8b_max_tokens: 2000
      local_14b_max_tokens: 4000
      cloud_70b_max_tokens: 32000
      # Longer → Cloud/API

    # Cost-based routing
    cost_routing:
      enabled: true
      daily_budget_usd: 10.0
      prefer_free_until_complexity: 0.6
      cloud_only_if_complexity_above: 0.5

    # Adaptive learning (learns from usage patterns)
    adaptive:
      enabled: true
      learning_rate: 0.05
      min_samples: 20
      success_rate_threshold: 0.8
      latency_weight: 0.3
      quality_weight: 0.5
      cost_weight: 0.2

# =============================================================================
# GCP INFRASTRUCTURE
# =============================================================================

gcp:
  enabled: "${GCP_ENABLED:-false}"

  project_id: "${GCP_PROJECT_ID}"
  region: "${GCP_REGION:-us-central1}"
  zone: "${GCP_ZONE:-us-central1-a}"

  spot_vm:
    enabled: true
    machine_type: "n1-standard-8"  # 8 vCPU, 30GB RAM
    gpu_type: "nvidia-tesla-t4"    # or nvidia-tesla-a100
    gpu_count: 1
    disk_size_gb: 100
    disk_type: "pd-ssd"

    # Preemption handling
    preemption:
      check_interval_seconds: 60
      signal_file: "/tmp/preemption_signal"
      checkpoint_on_preemption: true
      auto_migrate: true

    # Auto-scaling
    auto_scaling:
      enabled: true
      min_instances: 0
      max_instances: 2
      scale_up_threshold_percent: 80
      scale_down_threshold_percent: 20
      cooldown_seconds: 300

    # Cost limits
    cost_limits:
      max_hourly_spend: 5.0
      max_daily_spend: 50.0
      alert_threshold_percent: 80

  # Service account
  service_account: "${GCP_SERVICE_ACCOUNT}"
  credentials_path: "${GOOGLE_APPLICATION_CREDENTIALS:-~/.gcp/credentials.json}"

# =============================================================================
# CLAUDE API CONFIGURATION
# =============================================================================

claude_api:
  enabled: "${CLAUDE_API_ENABLED:-true}"
  api_key: "${ANTHROPIC_API_KEY}"
  base_url: "https://api.anthropic.com/v1"

  # Model selection
  default_model: "claude-3-5-sonnet-20241022"
  fallback_model: "claude-3-haiku-20240307"

  # Rate limiting
  rate_limits:
    requests_per_minute: 50
    tokens_per_minute: 100000
    concurrent_requests: 10

  # Retry configuration
  retry:
    max_retries: 3
    initial_backoff_seconds: 1.0
    max_backoff_seconds: 30.0
    exponential_base: 2.0
    jitter_factor: 0.1

  # Cost tracking
  cost_tracking:
    enabled: true
    alert_daily_threshold: 10.0
    alert_monthly_threshold: 200.0

# =============================================================================
# SERVICE MESH & DISCOVERY
# =============================================================================

service_mesh:
  enabled: true

  # Service registry
  registry:
    type: "file"  # file, consul, etcd, kubernetes
    file_path: "${HOME}/.jarvis/trinity/service_registry.json"
    refresh_interval_seconds: 5
    stale_threshold_seconds: 30

  # Health checking
  health:
    check_interval_seconds: 10
    timeout_seconds: 5
    failure_threshold: 3
    success_threshold: 2

  # Circuit breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    success_threshold: 2
    timeout_seconds: 30
    half_open_max_calls: 3

  # Load balancing
  load_balancing:
    strategy: "round_robin"  # round_robin, least_connections, random, weighted
    sticky_sessions: false
    health_check_filter: true

  # Connection pooling
  connection_pool:
    enabled: true
    max_connections_per_host: 10
    max_keepalive_connections: 5
    keepalive_expiry_seconds: 300
    connection_timeout_seconds: 5
    read_timeout_seconds: 60

# =============================================================================
# TRINITY PROTOCOL (CROSS-REPO IPC)
# =============================================================================

trinity_protocol:
  enabled: true

  # IPC directory
  ipc_dir: "${HOME}/.jarvis/trinity"

  # Transport layer
  transport:
    primary: "file"  # file, websocket, grpc
    fallback: "http"

    file:
      heartbeat_interval_seconds: 5
      stale_threshold_seconds: 30
      atomic_writes: true

    websocket:
      port: 9000
      ping_interval_seconds: 30
      reconnect_interval_seconds: 5
      max_reconnect_attempts: 10

    http:
      timeout_seconds: 30
      keepalive: true

  # Message handling
  messaging:
    max_message_size_bytes: 1048576  # 1MB
    compression: "gzip"
    encryption: false  # Enable for production

  # Guaranteed delivery
  delivery:
    enabled: true
    ack_timeout_seconds: 5
    max_retries: 10
    retry_delay_seconds: 1.0
    persistence: true
    dead_letter_threshold: 10

# =============================================================================
# RELIABILITY & RESILIENCE
# =============================================================================

reliability:
  # SQLite retry engine
  sqlite:
    max_retries: 5
    initial_backoff_seconds: 0.05
    max_backoff_seconds: 5.0
    exponential_base: 2.0
    jitter_factor: 0.1
    enable_wal: true
    pool_size: 5
    query_timeout_seconds: 30

  # OOM protection
  oom_protection:
    enabled: true
    memory_threshold_percent: 95  # Emergency
    warning_threshold_percent: 85
    gc_threshold_percent: 80
    check_interval_seconds: 5
    enable_aggressive_gc: true
    load_shed_cooldown_seconds: 30

  # Rate limiting
  rate_limiting:
    enabled: true
    default_requests_per_second: 100
    burst_size: 20
    adaptive: true

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  # Logging
  logging:
    level: "${LOG_LEVEL:-INFO}"
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    date_format: "%H:%M:%S"
    structured: true
    log_dir: "${HOME}/.jarvis/logs"
    max_file_size_mb: 100
    backup_count: 5

  # Metrics
  metrics:
    enabled: true
    export_interval_seconds: 15
    export_path: "${HOME}/.jarvis/metrics"
    prometheus_port: 9090

  # Distributed tracing
  tracing:
    enabled: "${TRACING_ENABLED:-false}"
    exporter: "otlp"  # otlp, jaeger, zipkin
    endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}"
    sample_rate: 0.1

  # Health dashboard
  dashboard:
    enabled: true
    port: 8888
    refresh_interval_seconds: 5

# =============================================================================
# SECURITY
# =============================================================================

security:
  # Kill switch
  kill_switch:
    enabled: true
    state_file: "${HOME}/.jarvis/cross_repo/kill_switch_state.json"

  # Action safety
  action_safety:
    enabled: true
    confirmation_required_for:
      - "delete"
      - "remove"
      - "execute"
      - "install"
      - "uninstall"
    risk_levels:
      low: 0.3
      medium: 0.6
      high: 0.8
      critical: 0.95

  # API keys
  api_keys:
    rotation_interval_days: 90
    encryption: true

# =============================================================================
# STARTUP CONFIGURATION
# =============================================================================

startup:
  # Startup order (respects dependencies)
  order:
    - "jarvis_prime"
    - "jarvis"
    - "reactor_core"

  # Parallel startup for independent components
  parallel_startup: false

  # Verification after startup
  verification:
    enabled: true
    process_check: true
    health_check: true
    functional_check: true
    timeout_seconds: 120

  # Pre-flight checks
  preflight:
    check_disk_space: true
    min_disk_space_gb: 10
    check_memory: true
    min_memory_mb: 4096
    check_gpu: true
    check_network: true
    check_dependencies: true

# =============================================================================
# SHUTDOWN CONFIGURATION
# =============================================================================

shutdown:
  # Graceful shutdown
  graceful: true
  timeout_seconds: 30

  # Shutdown order (reverse of startup)
  order:
    - "reactor_core"
    - "jarvis"
    - "jarvis_prime"

  # Cleanup
  cleanup:
    clear_temp_files: true
    persist_state: true
    notify_components: true

# =============================================================================
# DEVELOPMENT & DEBUGGING
# =============================================================================

development:
  debug_mode: "${DEBUG:-false}"
  hot_reload: "${ENABLE_HOT_RELOAD:-true}"
  mock_gcp: "${MOCK_GCP:-true}"
  mock_claude: "${MOCK_CLAUDE:-false}"
  profile_enabled: "${PROFILE:-false}"

  # Test endpoints
  test_endpoints:
    echo: "/test/echo"
    health: "/test/health"
    metrics: "/test/metrics"

# =============================================================================
# v241.0: GCP Multi-Model Routing (e2-standard-4, 16 GB RAM, CPU-only)
# =============================================================================
gcp_model_routing:
  enabled: "${GCP_MULTI_MODEL_ENABLED:-true}"
  default_model: "${GCP_DEFAULT_MODEL:-mistral-7b}"
  models_dir: "${GCP_MODELS_DIR:-/opt/jarvis-prime/models}"

  # Per-model-size cooldowns to prevent swap thrashing
  cooldown_small_seconds: 30    # Models < 3 GB (Phi-3.5-mini, TinyLlama)
  cooldown_medium_seconds: 60   # Models 3-5 GB (Mistral, Qwen)
  cooldown_large_seconds: 90    # Models > 5 GB (LLaVA, Llama-3.1)

  swap_queue_max_size: 50
  swap_validation_timeout: 30

  # Model inventory (all Q4_K_M GGUF)
